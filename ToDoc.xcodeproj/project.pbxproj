/* Begin PBXShellScriptBuildPhase section */
		C6A1D0000000000000000004 /* Copy Models */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Copy Models";
			shellPath = /bin/sh;
			shellScript = (
				"# Models/<이름>이 있으면 tools/models/<이름>.sha256으로 해시를 검사하고 앱에 복사한다. 없으면 넣지 않는다.",
				"# 모델이 바뀌지 않았으면(크기·수정 시각 같음) 이미 검사한 것으로 보고 건너뛴다 (Kanana 2.4GB 검사에 약 5초)",
				"for SUMS in \"$SRCROOT\"/tools/models/*.sha256; do",
				"  NAME=$(basename \"$SUMS\" .sha256)",
				"  SRC=\"$SRCROOT/Models/$NAME\"",
				"  DEST=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$NAME\"",
				"  STAMP=\"$DERIVED_FILE_DIR/model-$NAME.stamp\"",
				"  # tools/models/<이름>.device-only가 있으면 시뮬레이터에는 넣지 않는다 (Kanana: 시뮬레이터에 CoreAI 없음)",
				"  if [ ! -d \"$SRC\" ] || { [ \"$PLATFORM_NAME\" = iphonesimulator ] && [ -f \"$SRCROOT/tools/models/$NAME.device-only\" ]; }; then",
				"    rm -rf \"$DEST\" \"$STAMP\"",
				"    continue",
				"  fi",
				"  CURRENT=$( (cat \"$SUMS\"; cd \"$SRC\" && find . -type f ! -name .DS_Store -exec stat -f '%N %z %m' {} + | LC_ALL=C sort) | shasum -a 256)",
				"  if [ -d \"$DEST\" ] && [ \"$(cat \"$STAMP\" 2>/dev/null)\" = \"$CURRENT\" ]; then",
				"    continue",
				"  fi",
				"  if ! (cd \"$SRC\" && shasum -a 256 -c --quiet \"$SUMS\"); then",
				"    echo \"error: Models/$NAME 파일이 고정 버전과 다릅니다. 모델을 다시 준비하세요.\"",
				"    exit 1",
				"  fi",
				"  rm -rf \"$DEST\"",
				"  mkdir -p \"$DEST\" \"$DERIVED_FILE_DIR\"",
				"  if ! (cd \"$SRC\" && awk '{print $2}' \"$SUMS\" | rsync -a --files-from=- . \"$DEST/\"); then",
				"    echo \"error: Models/$NAME을 앱에 복사하지 못했습니다.\"",
				"    exit 1",
				"  fi",
				"  echo \"$CURRENT\" > \"$STAMP\"",
				"done",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

